<form [formGroup]="formGroup()" (ngSubmit)="handleSubmit()" class="mt-5 space-y-3">
  <ng-content></ng-content>

  <div class="flex justify-end gap-3 pt-4">
    <button
      type="button"
      (click)="handleCancel()"
      class="rounded-xl px-4 py-2 text-sm font-semibold text-gray-500 transition hover:bg-gray-100"
    >
      Cancelar
    </button>

    <button
      type="submit"
      [disabled]="isLoading()"
      class="rounded-xl bg-[#0e3521] px-5 py-2 text-sm font-semibold text-white transition hover:bg-emerald-900 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isLoading() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</form>
