<div class="h-screen flex flex-col overflow-hidden">
  <!-- Topbar -->

  <!-- Arbol principal centrado -->
  <main class="flex-1 flex items-center justify-center px-6 py-6 min-h-0">
    <!-- Tarjeta del Formulario (con posición 'relative' para la flecha) -->
    <div
      class="relative w-full max-w-md bg-white p-8 md:p-10 rounded-2xl border-gray-100 flex flex-col gap-6"
    >
      <!-- Flecha Superior de Salir / Back -->
      <div>
        <a
          routerLink="/login"
          class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-[#003646] font-medium transition-colors cursor-pointer group"
          title="Back to login"
        >
          <div
            class="p-2 rounded-full bg-gray-100 group-hover:bg-gray-200 transition-colors flex items-center justify-center"
          >
            <ng-icon
              name="heroArrowLeftSolid"
              class="text-base text-gray-700 group-hover:text-[#003646]"
            ></ng-icon>
          </div>
        </a>
      </div>

      <!-- Encabezado -->
      <div class="flex flex-col gap-2">
        <h1 class="font-bold text-2xl text-[#0e3521]">Reset your password</h1>
        <p class="text-sm text-gray-600 leading-relaxed">
          Enter your email address and we’ll send you instructions to reset your password.
        </p>
      </div>

      <!-- Formulario -->
      <form (submit)="$event.preventDefault()" class="flex flex-col gap-5">
        <!-- Campo: Email -->
        <div class="flex flex-col gap-1.5">
          <label for="reset-email" class="font-semibold text-gray-800 text-sm">
            Email address
          </label>
          <div
            class="w-full p-2.5 bg-gray-100 flex gap-2.5 items-center rounded-xl border border-gray-300 transition-colors focus-within:border-[#003646] focus-within:bg-white"
          >
            <ng-icon name="heroEnvelopeSolid" class="text-gray-500 text-lg shrink-0"></ng-icon>
            <input
              id="reset-email"
              type="email"
              required
              autocomplete="email"
              class="outline-none w-full bg-transparent text-sm text-gray-800 placeholder-gray-400"
              placeholder="Enter your email"
            />
          </div>
        </div>

        <!-- Botón de Envío -->
        <button
          type="submit"
          class="w-full bg-[#0e3521] hover:bg-[#002834] p-3.5 rounded-xl font-semibold cursor-pointer text-white items-center justify-center transition-colors shadow-md mt-1"
        >
          <span>Send instructions</span>
        </button>
      </form>

      <!-- Footer de la tarjeta -->
      <div class="flex justify-center items-center pt-2 border-t border-gray-100">
        <a
          routerLink="/login"
          class="inline-flex items-center gap-2 text-sm font-semibold text-[#165070] hover:text-[#003646] hover:underline transition-colors cursor-pointer"
        >
          <!-- <span>Back to sign in</span> -->
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
</div>
