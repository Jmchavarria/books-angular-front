<div
  class="flex h-10 items-center rounded-full border border-gray-300 bg-white transition-all duration-300 ease-in-out focus-within:border-gray-500 focus-within:ring-2 focus-within:ring-gray-100"
  [class.w-10]="!isSearchOpen"
  [class.w-full]="isSearchOpen"
  [class.max-w-md]="isSearchOpen"
  (click)="openSearch()"
>
  <button
    type="button"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
    (click)="openSearch()"
  >
    <ng-icon name="heroMagnifyingGlassSolid" color="#969696" class="text-xl"></ng-icon>
  </button>

  <input
    #searchInput
    type="text"
    placeholder="Search..."
    class="w-full min-w-0 bg-transparent pr-4 text-sm text-gray-700 placeholder:text-gray-400 outline-none"
    [class.hidden]="!isSearchOpen"
    (click)="$event.stopPropagation()"
  />
</div>
