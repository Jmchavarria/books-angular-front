<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 backdrop-blur-sm">
  <!-- Agregamos max-h y flex flex-col para controlar la altura -->
  <div
    class="flex max-h-[90vh] w-full flex-col rounded-2xl bg-white p-6 shadow-xl transition-all duration-200"
    [class]="sizeClasses[size()]"
  >
    <div class="flex items-start justify-between">
      <div>
        @if (title()) {
          <h3 class="text-lg font-bold text-gray-900">{{ title() }}</h3>
        }
        @if (description()) {
          <p class="mt-1 text-xs text-gray-500">{{ description() }}</p>
        }
      </div>
      <button
        type="button"
        (click)="handleCancel()"
        aria-label="Cerrar modal"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-100 hover:text-gray-700"
      >
        <ng-icon name="heroXMark" class="text-lg"></ng-icon>
      </button>
    </div>

    <!-- Tab Bar -->
    @if (tabs().length > 0) {
      <div class="mt-5 flex gap-1 border-b border-gray-200">
        @for (tab of tabs(); track tab.id) {
          <button
            type="button"
            (click)="selectTab(tab.id)"
            [class]="
              activeTab() === tab.id
                ? 'relative -mb-px border-b-2 border-indigo-600 px-3.5 pb-2.5 text-sm font-medium text-indigo-600 outline-none transition-colors focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 rounded-t-sm'
                : 'relative -mb-px border-b-2 border-transparent px-3.5 pb-2.5 text-sm font-medium text-gray-500 outline-none transition-colors hover:text-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 rounded-t-sm'
            "
          >
            {{ tab.label }}
          </button>
        }
      </div>
    }

    <!-- Content (Scrollable) -->
    <div class="mt-4 flex-1 overflow-y-auto pr-1">
      <ng-content></ng-content>
    </div>
  </div>
</div>
