<div class="h-screen flex flex-col overflow-hidden bg-gray-50">
  <!-- Topbar -->
  <!-- Grilla principal -->
  <div class="flex-1 grid grid-cols-2 px-20 py-6 min-h-0">
    <!-- Columna Izquierda: Imagen / Banner -->
    <div
      class="relative rounded-l-xl overflow-hidden flex items-end p-10 h-full shadow-2xl"
      style="
        background-image: url('https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=1200&auto=format&fit=crop&q=80');
        background-size: cover;
        background-position: center;
      "
    >
      <div class="absolute inset-0 bg-black/30"></div>

      <div class="relative z-10 text-white flex flex-col gap-2">
        <span class="text-xs uppercase tracking-widest font-semibold opacity-80">
          Join the Collection
        </span>
        <h2 class="text-2xl font-bold leading-tight">
          Start organizing and curating your workspace today.
        </h2>
      </div>
    </div>

    <!-- Columna Derecha: Formulario de Registro -->
    <div
      class="shadow-2xl rounded-r-xl p-8 bg-white flex items-center justify-center border-l border-gray-100 h-full overflow-y-auto"
    >
      <div class="w-full max-w-md flex flex-col gap-4">
        <!-- Encabezado -->
        <div class="flex flex-col gap-1">
          <h1 class="font-bold text-2xl text-[#0e3521]">Create an account</h1>
          <p class="text-gray-600 text-sm">Get started in seconds or fill in your details.</p>
        </div>

        <!-- Botón de Google -->
        <button
          type="button"
          (click)="signUpWithGoogle()"
          class="w-full py-2.5 px-4 flex items-center justify-center gap-3 border border-gray-300 rounded-xl bg-white text-gray-700 font-semibold text-sm hover:bg-gray-50 hover:border-gray-400 transition-colors shadow-sm cursor-pointer mt-1"
        >
          <!-- SVG oficial del logo de Google -->
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
            />
          </svg>
          <span>Continue with Google</span>
        </button>

        <!-- Divisor "or" -->
        <div class="flex items-center my-1">
          <div class="flex-1 border-t border-gray-200"></div>
          <span class="px-3 text-xs text-gray-400 uppercase tracking-wider font-medium">or</span>
          <div class="flex-1 border-t border-gray-200"></div>
        </div>

        <!-- Formulario Tradicional -->
        <form (submit)="$event.preventDefault()" class="flex flex-col gap-3.5">
          <!-- Campo: Full Name -->
          <div class="flex flex-col gap-1">
            <label for="fullName" class="font-semibold text-gray-800 text-xs">Full Name</label>
            <div
              class="w-full p-2.5 bg-gray-100 flex gap-2 items-center rounded-xl border border-gray-300 focus-within:border-[#003646] focus-within:bg-white transition-colors"
            >
              <ng-icon name="heroUserSolid" class="text-gray-500 shrink-0"></ng-icon>
              <input
                id="fullName"
                type="text"
                class="outline-none w-full bg-transparent text-sm text-gray-800"
                placeholder="John Doe"
              />
            </div>
          </div>

          <!-- Campo: Email -->
          <div class="flex flex-col gap-1">
            <label for="email" class="font-semibold text-gray-800 text-xs">Email</label>
            <div
              class="w-full p-2.5 bg-gray-100 flex gap-2 items-center rounded-xl border border-gray-300 focus-within:border-[#003646] focus-within:bg-white transition-colors"
            >
              <ng-icon name="heroEnvelopeSolid" class="text-gray-500 shrink-0"></ng-icon>
              <input
                id="email"
                type="email"
                class="outline-none w-full bg-transparent text-sm text-gray-800"
                placeholder="Enter your email"
              />
            </div>
          </div>

          <!-- Campo: Password -->
          <div class="flex flex-col gap-1">
            <label for="password" class="font-semibold text-gray-800 text-xs">Password</label>
            <div
              class="w-full p-2.5 bg-gray-100 flex gap-2 items-center rounded-xl border border-gray-300 focus-within:border-[#003646] focus-within:bg-white transition-colors"
            >
              <ng-icon name="heroLockClosedSolid" class="text-gray-500 shrink-0"></ng-icon>
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                class="outline-none w-full bg-transparent text-sm text-gray-800"
                placeholder="Create a password"
              />
              <button
                type="button"
                (click)="showPassword = !showPassword"
                class="flex items-center text-gray-500 hover:text-gray-700 focus:outline-none shrink-0"
              >
                <ng-icon [name]="showPassword ? 'heroEyeSlashSolid' : 'heroEyeSolid'"></ng-icon>
              </button>
            </div>
          </div>

          <!-- Botón de Registro -->
          <button
            type="submit"
            class="w-full bg-[#003646] hover:bg-[#002834] p-3 rounded-xl font-semibold cursor-pointer text-white flex gap-2 items-center justify-center transition-colors shadow-lg mt-1"
          >
            <span>Create Account</span>
            <ng-icon name="heroArrowRightSolid" class="text-white text-xl shrink-0"></ng-icon>
          </button>

          <!-- Ir al Login -->
          <div class="flex gap-2 items-center justify-center text-sm mt-1">
            <span class="text-gray-600">Already have an account?</span>
            <a
              routerLink="/login"
              class="font-semibold text-[#003646] hover:underline cursor-pointer"
              >Sign in</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
</div>
