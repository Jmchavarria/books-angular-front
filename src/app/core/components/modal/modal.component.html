<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 backdrop-blur-sm">
  <div class="w-full max-w-2xl rounded-2xl bg-white p-6 shadow-xl">
    <!-- Header -->
    <div class="flex items-start justify-between">
      <div>
        <h3 class="text-lg font-bold text-gray-900">{{ title() }}</h3>
        <p class="mt-1 text-xs text-gray-500">{{ description() }}</p>
      </div>
      <button
        type="button"
        (click)="handleCancel()"
        aria-label="Cerrar modal"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-100 hover:text-gray-700"
      >
        <ng-icon name="heroXMark" class="text-lg"></ng-icon>
      </button>
    </div>

    <!-- Tab Bar (Solo se renderiza si pasas pestañas) -->
    @if (tabs() && tabs().length > 0) {
      <div class="mt-4 flex border-b border-gray-200">
        @for (tab of tabs(); track tab.id; let isFirst = $first) {
          <button
            type="button"
            (click)="selectTab(tab.id)"
            [class]="
              (activeTab() ? activeTab() === tab.id : isFirst)
                ? 'border-b-2 border-indigo-600 pb-2 px-3 text-sm font-semibold text-indigo-600 '
                : 'pb-2 px-3 text-sm font-medium text-gray-500 hover:text-gray-700 '
            "
          >
            {{ tab.label }}
          </button>
        }
      </div>
    }

    <!-- Content -->
    <div class="mt-4">
      <ng-content></ng-content>
    </div>
  </div>
</div>
