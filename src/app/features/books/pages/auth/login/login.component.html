<div class="h-screen flex flex-col overflow-hidden bg-gray-50">
  <app-minimal-top-bar class="shrink-0"></app-minimal-top-bar>

  <div class="flex-1 grid grid-cols-2 px-20 py-5 min-h-0">
    <div
      class="relative rounded-l-xl overflow-hidden flex items-end p-10 h-full shadow-2xl"
      style="
        background-image: url('https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=600&h=1000&fit=crop&crop=center');
        background-size: cover;
        background-position: center;
      "
    >
      <div class="absolute inset-0 bg-black/30"></div>

      <div class="relative z-10 text-white flex flex-col gap-2">
        <span class="text-xs uppercase tracking-widest font-semibold opacity-80">
          Curated Library
        </span>
        <h2 class="text-2xl font-bold leading-tight">
          Discover and manage your unique collection.
        </h2>
      </div>
    </div>

    <div
      class="shadow-2xl rounded-r-xl bg-white flex items-center justify-center border-l border-gray-100 h-full overflow-y-auto"
    >
      <div class="w-full max-w-md flex flex-col gap-5">
        <!-- Encabezado -->
        <div class="flex flex-col gap-1">
          <h1 class="font-bold text-2xl text-[#0e3521]">Welcome Back</h1>
          <p class="text-gray-600 text-sm">Sign in to access your curated collection.</p>
        </div>

        <!-- Formulario -->
        <div class="flex flex-col gap-5">
          <div class="flex flex-col gap-1.5">
            <label for="email" class="font-semibold text-gray-800 text-sm">Email</label>
            <div
              class="w-full p-2.5 bg-gray-100 flex gap-2 items-center rounded-xl border border-gray-300 focus-within:border-[#003646]"
            >
              <ng-icon name="heroEnvelopeSolid" class="text-gray-500 shrink-0"></ng-icon>
              <input
                id="email"
                type="email"
                class="outline-none w-full bg-transparent text-sm"
                placeholder="Enter your email"
              />
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <div class="flex justify-between items-center">
              <label for="password" class="font-semibold text-gray-800 text-sm">Password</label>
              <a
                href="#"
                routerLink="/reset-password"
                class="text-[#165070] text-xs cursor-pointer hover:text-[#2778a3] hover:underline"
              >
                Forgot Password?
              </a>
            </div>
            <div
              class="w-full p-2.5 bg-gray-100 flex gap-2 items-center rounded-xl border border-gray-300 focus-within:border-[#003646]"
            >
              <ng-icon name="heroLockClosedSolid" class="text-gray-500 shrink-0"></ng-icon>

              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                class="outline-none w-full bg-transparent text-gray-800 text-sm"
                placeholder="Enter your password"
              />

              <button
                type="button"
                (click)="showPassword = !showPassword"
                class="flex items-center text-gray-500 hover:text-gray-700 focus:outline-none shrink-0"
                [ariaLabel]="showPassword ? 'Hide password' : 'Show password'"
              >
                <ng-icon [name]="showPassword ? 'heroEyeSlashSolid' : 'heroEyeSolid'"></ng-icon>
              </button>
            </div>
          </div>

          <button
            type="submit"
            c
            class="w-full bg-[#003646] hover:bg-[#002834] p-3.5 rounded-xl font-semibold cursor-pointer text-white items-center justify-center transition-colors shadow-lg mt-2"
          >
            <span>Sign In</span>
          </button>

          <div class="justify-center flex">
            <label for="" class="text-sm text-gray-500">OR</label>
          </div>

          <div id="google-signin-button"></div>

          <div class="flex gap-2 items-center justify-center text-sm mt-1">
            <span class="text-gray-600">New to the collection?</span>
            <a
              href="#"
              routerLink="/create-account"
              class="font-semibold text-[#003646] hover:underline"
              >Create an account</a
            >
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-minimal-footer class="shrink-0"></app-minimal-footer>
</div>
