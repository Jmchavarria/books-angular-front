<div class="h-screen flex flex-col overflow-hidden bg-gray-50">
  <!-- Topbar -->
  <app-minimal-top-bar class="shrink-0"></app-minimal-top-bar>

  <!-- Grilla principal -->
  <div class="flex-1 grid grid-cols-2 px-8 lg:px-16 py-3 min-h-0 gap-0">
    <!-- Columna Izquierda: Imagen / Banner -->
    <div
      class="relative rounded-l-xl overflow-hidden flex items-end p-8 h-full shadow-2xl"
      style="
        background-image: url('https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=1200&auto=format&fit=crop&q=80');
        background-size: cover;
        background-position: center;
      "
    >
      <div class="absolute inset-0 bg-black/30"></div>

      <div class="relative z-10 text-white flex flex-col gap-1.5">
        <span class="text-xs uppercase tracking-widest font-semibold opacity-80">
          Join the Collection
        </span>
        <h2 class="text-xl lg:text-2xl font-bold leading-tight">
          Start organizing and curating your workspace today.
        </h2>
      </div>
    </div>

    <!-- Columna Derecha: Formulario de Registro -->
    <div
      class="shadow-2xl rounded-r-xl px-8 py-4 bg-white flex items-center justify-center border-l border-gray-100 h-full overflow-hidden"
    >
      <div class="w-full max-w-md flex flex-col gap-2.5">
        <!-- Encabezado -->
        <div class="flex flex-col gap-0.5">
          <h1 class="font-bold text-xl lg:text-2xl text-[#0e3521]">Create an account</h1>
          <p class="text-gray-600 text-xs lg:text-sm">
            Get started in seconds or fill in your details.
          </p>
        </div>

        <!-- Botón de Google -->

        <!-- Divisor "or" -->

        <!-- Formulario Tradicional -->
        <form (submit)="$event.preventDefault()" class="flex flex-col gap-2">
          <!-- Campo: Full Name -->
          <div class="flex flex-col gap-0.5">
            <label for="fullName" class="font-semibold text-gray-800 text-[11px]">Full Name</label>
            <div
              class="w-full p-2 bg-gray-100 flex gap-2 items-center rounded-xl border border-gray-300 focus-within:border-[#003646] focus-within:bg-white transition-colors"
            >
              <input
                id="fullName"
                type="text"
                class="outline-none w-full bg-transparent text-xs lg:text-sm text-gray-800"
                placeholder="John Doe"
              />
            </div>
          </div>

          <!-- Campo: Email -->
          <div class="flex flex-col gap-0.5">
            <label for="email" class="font-semibold text-gray-800 text-[11px]">Email</label>
            <div
              class="w-full p-2 bg-gray-100 flex gap-2 items-center rounded-xl border border-gray-300 focus-within:border-[#003646] focus-within:bg-white transition-colors"
            >
              <input
                id="email"
                type="email"
                class="outline-none w-full bg-transparent text-xs lg:text-sm text-gray-800"
                placeholder="Enter your email"
              />
            </div>
          </div>

          <!-- Campo: Password -->
          <div class="flex flex-col gap-0.5">
            <label for="password" class="font-semibold text-gray-F800 text-[11px]">Password</label>
            <div
              class="w-full p-2 bg-gray-100 flex gap-2 items-center rounded-xl border border-gray-300 focus-within:border-[#003646] focus-within:bg-white transition-colors"
            >
              <input
                id="password"
                type="password"
                class="outline-none w-full bg-transparent text-xs lg:text-sm text-gray-800"
                placeholder="••••••••"
              />
            </div>
          </div>

          <!-- Botón de Registro -->
          <button
            type="submit"
            class="w-full bg-[#003646] hover:bg-[#002834] p-2.5 rounded-xl font-semibold cursor-pointer text-white flex gap-2 items-center justify-center transition-colors shadow-lg mt-1 text-xs lg:text-sm"
          >
            <span>Create Account</span>
          </button>

          <div class="flex items-center my-0.5">
            <div class="flex-1 border-t border-gray-200"></div>
            <span class="px-3 text-[10px] text-gray-400 uppercase tracking-wider font-medium"
              >or</span
            >
            <div class="flex-1 border-t border-gray-200"></div>
          </div>

          <div id="google-signin-button"></div>
        </form>

        <!-- Ir al Login -->
        <div class="flex gap-2 items-center justify-center text-xs mt-0.5">
          <span class="text-gray-600">Already have an account?</span>
          <a routerLink="/login" class="font-semibold text-[#003646] hover:underline cursor-pointer"
            >Sign in</a
          >
        </div>
      </div>
    </div>
  </div>

  <app-minimal-footer class="shrink-0"></app-minimal-footer>
</div>
