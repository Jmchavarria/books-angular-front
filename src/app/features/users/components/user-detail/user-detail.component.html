<div class="mt-6 space-y-5">
  <!-- Información personal -->
  <div>
    <h4 class="mb-3 text-sm font-semibold text-gray-900">
      Personal information
    </h4>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <p class="text-xs text-gray-500">First name</p>
        <p class="mt-1 text-sm font-medium text-gray-900">
          {{ user().firstName }}
        </p>
      </div>

      <div>
        <p class="text-xs text-gray-500">Last name</p>
        <p class="mt-1 text-sm font-medium text-gray-900">
          {{ user().lastName }}
        </p>
      </div>

      <div>
        <p class="text-xs text-gray-500">Email</p>
        <p class="mt-1 text-sm font-medium text-gray-900">
          {{ user().email }}
        </p>
      </div>

      <div>
        <p class="text-xs text-gray-500">Phone</p>
        <p class="mt-1 text-sm font-medium text-gray-900">
          {{ user().phone }}
        </p>
      </div>
    </div>
  </div>

  <!-- Información de cuenta -->
  <div class="border-t border-gray-200 pt-5">
    <h4 class="mb-3 text-sm font-semibold text-gray-900">
      Account information
    </h4>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <p class="text-xs text-gray-500">User ID</p>
        <p class="mt-1 text-sm font-medium text-gray-900">
          {{ user().id }}
        </p>
      </div>

      <div>
        <p class="text-xs text-gray-500">Role</p>
        <p class="mt-1">
          <span
            class="inline-flex rounded-full bg-blue-50 px-2.5 py-1 text-xs font-medium text-blue-700"
          >
            {{ user().role }}
          </span>
        </p>
      </div>

      <div>
        <p class="text-xs text-gray-500">Status</p>
        <p class="mt-1">
          <span
            class="inline-flex rounded-full bg-green-50 px-2.5 py-1 text-xs font-medium text-green-700"
          >
            {{ user().status }}
          </span>
        </p>
      </div>
    </div>
  </div>
</div>
