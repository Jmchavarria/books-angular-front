<div class="relative inline-block text-left">
  <button
    type="button"
    [attr.id]="triggerId()"
    [attr.aria-controls]="menuId()"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleMenu($event)"
    class="inline-flex items-center justify-center p-2 rounded-xl text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
  >
    <ng-content select="[trigger]"></ng-content>
  </button>

  @if (isOpen()) {
    <div
      [attr.id]="menuId()"
      role="menu"
      tabindex="-1"
      [attr.aria-labelledby]="triggerId()"
      [style.top.px]="menuPosition()?.top"
      [style.left.px]="menuPosition()?.left"
      [class.opacity-0]="!menuReady()"
      class="fixed z-50 w-44 rounded-xl border border-gray-200 bg-white p-1.5 shadow-lg ring-1 ring-black/5 space-y-1"
      data-open-menu
      (keydown)="onMenuKeydown($event)"
    >
      <ng-content select="[content]"></ng-content>
    </div>
  }
</div>
